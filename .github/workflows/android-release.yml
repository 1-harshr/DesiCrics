name: Firebase App Distribution

# Keep the workflow path so Android version codes continue from previous releases.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  distribute:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the signed release APK
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          : "${GOOGLE_SERVICES_JSON:?Set the GOOGLE_SERVICES_JSON repository secret}"
          : "${RELEASE_KEYSTORE_BASE64:?Set the RELEASE_KEYSTORE_BASE64 repository secret}"
          : "${RELEASE_KEYSTORE_PASSWORD:?Set the RELEASE_KEYSTORE_PASSWORD repository secret}"
          : "${RELEASE_KEY_ALIAS:?Set the RELEASE_KEY_ALIAS repository secret}"
          : "${RELEASE_KEY_PASSWORD:?Set the RELEASE_KEY_PASSWORD repository secret}"

          printf '%s' "$GOOGLE_SERVICES_JSON" > app/androidApp/google-services.json
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          ./gradlew :app:androidApp:assembleRemoteRelease \
            -Pdesicrics.versionCode="$GITHUB_RUN_NUMBER" \
            -Pdesicrics.versionName="1.0.$GITHUB_RUN_NUMBER" \
            -Pdesicrics.releaseKeystore="$RUNNER_TEMP/release.keystore" \
            -Pdesicrics.releaseKeystorePassword="$RELEASE_KEYSTORE_PASSWORD" \
            -Pdesicrics.releaseKeyAlias="$RELEASE_KEY_ALIAS" \
            -Pdesicrics.releaseKeyPassword="$RELEASE_KEY_PASSWORD"

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Distribute to internal testers
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          : "${FIREBASE_SERVICE_ACCOUNT:?Set the FIREBASE_SERVICE_ACCOUNT repository secret}"
          app_id=$(jq -er '
            [.client[] | select(.client_info.android_client_info.package_name == "com.harsh.desicrics")][0]
            | .client_info.mobilesdk_app_id | select(type == "string" and length > 0)
          ' app/androidApp/google-services.json)

          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$GOOGLE_APPLICATION_CREDENTIALS"
          npx --yes firebase-tools@15 appdistribution:distribute \
            app/androidApp/build/outputs/apk/remote/release/androidApp-remote-release.apk \
            --app "$app_id" --groups internal --release-notes "$GITHUB_REF_NAME @ $GITHUB_SHA"
