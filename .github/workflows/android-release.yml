name: Android release

# Builds the release APK (remote flavor: the deployed server) once CI passes on main, then hands it to
# testers through Firebase App Distribution and keeps a copy on the workflow run. See docs/deploy.md
# ("Android releases") for the secrets it needs; until they're set it explains what's missing and stops.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-release
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  release:
    # From CI only when it passed on a push (not a pull request); by hand, always.
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - name: Check secrets
        id: secrets
        run: |
          missing=""
          for name in GOOGLE_SERVICES_JSON RELEASE_KEYSTORE_BASE64 RELEASE_KEYSTORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::notice::Skipping the release build; repository secrets not set:$missing"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ready == 'true'
        with:
          # The commit CI just passed, not whatever main has moved on to since.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # Matches gradle/gradle-daemon-jvm.properties.
      - uses: actions/setup-java@v4
        if: steps.secrets.outputs.ready == 'true'
        with:
          distribution: zulu
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        if: steps.secrets.outputs.ready == 'true'

      - name: Build the release APK
        if: steps.secrets.outputs.ready == 'true'
        run: |
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/androidApp/google-services.json
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          ./gradlew :app:androidApp:assembleRemoteRelease \
            -Pdesicrics.versionCode=${{ github.run_number }} \
            -Pdesicrics.versionName="$VERSION_NAME" \
            -Pdesicrics.releaseKeystore="$RUNNER_TEMP/release.keystore" \
            -Pdesicrics.releaseKeystorePassword="$RELEASE_KEYSTORE_PASSWORD" \
            -Pdesicrics.releaseKeyAlias="$RELEASE_KEY_ALIAS" \
            -Pdesicrics.releaseKeyPassword="$RELEASE_KEY_PASSWORD"
          mv app/androidApp/build/outputs/apk/remote/release/androidApp-remote-release.apk "DesiCrics-$VERSION_NAME.apk"

      # Download from the workflow run's page (Actions › Android release › Artifacts).
      - uses: actions/upload-artifact@v4
        if: steps.secrets.outputs.ready == 'true'
        with:
          name: DesiCrics-${{ env.VERSION_NAME }}
          path: DesiCrics-${{ env.VERSION_NAME }}.apk

      # Testers in the "internal" group get an email and install from Firebase's App Tester app.
      - name: Send to Firebase App Distribution
        if: steps.secrets.outputs.ready == 'true'
        env:
          RELEASE_NOTES: ${{ github.event.workflow_run.head_commit.message || 'Built by hand from main' }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::notice::FIREBASE_SERVICE_ACCOUNT secret not set; the APK is only on this run's artifacts."
            exit 0
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase.json"
          printf '%s' "$RELEASE_NOTES" > "$RUNNER_TEMP/notes.txt"
          app_id=$(jq -r '.client[] | select(.client_info.android_client_info.package_name == "com.harsh.desicrics") | .client_info.mobilesdk_app_id' app/androidApp/google-services.json | head -1)
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase.json" npx --yes firebase-tools@15 appdistribution:distribute \
            "DesiCrics-$VERSION_NAME.apk" --app "$app_id" --groups internal --release-notes-file "$RUNNER_TEMP/notes.txt"
