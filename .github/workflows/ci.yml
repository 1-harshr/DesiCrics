name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The server tests run on H2 locally; in CI they also run on the Postgres the server uses in production.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: desicrics
          POSTGRES_USER: desicrics
          POSTGRES_PASSWORD: desicrics
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U desicrics -d desicrics"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      # Matches gradle/gradle-daemon-jvm.properties.
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (core on JVM and JS, app, server)
        run: ./gradlew :core:jvmTest :core:jsNodeTest :core:testAndroidHostTest :app:designsystem:compileAndroidMain :app:shared:testAndroidHostTest :server:test

      - name: Server tests on Postgres
        env:
          TEST_POSTGRES_URL: jdbc:postgresql://localhost:5432/desicrics
        run: ./gradlew :server:test --rerun-tasks

      # google-services.json is gitignored. Add its contents as the GOOGLE_SERVICES_JSON repository
      # secret to also build the APK; without it this step is skipped.
      - name: Build debug APK and run its tests
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "GOOGLE_SERVICES_JSON secret not set; skipping the APK build."
            exit 0
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/androidApp/google-services.json
          ./gradlew :app:androidApp:assembleLocalDebug :app:androidApp:testLocalDebugUnitTest

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/'

  # The web app (docs/web.md). It builds :core with Kotlin/JS, so it needs Java and Gradle too.
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      # Strings and icons are generated from the Android app's resources; fail if they're out of step.
      - name: Generated files are up to date
        run: |
          npm run strings
          npm run icons
          git diff --exit-code -- src/i18n/app.generated.json src/designsystem/icons.generated.ts

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
