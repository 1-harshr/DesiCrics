name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Matches gradle/gradle-daemon-jvm.properties.
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (core, app, server)
        run: ./gradlew :core:jvmTest :core:testAndroidHostTest :app:designsystem:compileAndroidMain :app:shared:testAndroidHostTest :server:test

      # google-services.json is gitignored. Add its contents as the GOOGLE_SERVICES_JSON repository
      # secret to also build the APK; without it this step is skipped.
      - name: Build debug APK
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "GOOGLE_SERVICES_JSON secret not set; skipping the APK build."
            exit 0
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/androidApp/google-services.json
          ./gradlew :app:androidApp:assembleDebug

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/'
