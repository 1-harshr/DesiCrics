name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The server tests run on H2 locally; in CI they also run on the Postgres the server uses in production.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: desicrics
          POSTGRES_USER: desicrics
          POSTGRES_PASSWORD: desicrics
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U desicrics -d desicrics"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      # Matches gradle/gradle-daemon-jvm.properties.
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (core, app, server)
        run: ./gradlew :core:jvmTest :core:testAndroidHostTest :app:designsystem:compileAndroidMain :app:shared:testAndroidHostTest :server:test

      - name: Server tests on Postgres
        env:
          TEST_POSTGRES_URL: jdbc:postgresql://localhost:5432/desicrics
        run: ./gradlew :server:test --rerun-tasks

      # google-services.json is gitignored. Add its contents as the GOOGLE_SERVICES_JSON repository
      # secret to also build the APK; without it this step is skipped.
      - name: Build debug APK and run its tests
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "GOOGLE_SERVICES_JSON secret not set; skipping the APK build."
            exit 0
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/androidApp/google-services.json
          ./gradlew :app:androidApp:assembleDebug :app:androidApp:testDebugUnitTest

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/'
