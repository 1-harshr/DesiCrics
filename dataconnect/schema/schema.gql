# DesiCrics schema for Firebase SQL Connect (Cloud SQL for PostgreSQL).
# Enum values match the Kotlin enums in :core so JSON maps straight across.

enum PlayerRole { BATTER BOWLER ALL_ROUNDER WICKET_KEEPER }
enum BattingStyle { RIGHT_HAND LEFT_HAND }
enum BowlingStyle {
  NONE
  RIGHT_ARM_FAST
  RIGHT_ARM_MEDIUM
  RIGHT_ARM_OFF_SPIN
  RIGHT_ARM_LEG_SPIN
  LEFT_ARM_FAST
  LEFT_ARM_MEDIUM
  LEFT_ARM_ORTHODOX
  LEFT_ARM_WRIST_SPIN
}
enum TeamSide { A B }
enum TossDecision { BAT BOWL }
# SETUP: created but the roster isn't fully saved yet, so it's hidden from lists.
enum MatchStatus { SETUP IN_PROGRESS COMPLETED }
enum ExtraType { WIDE NO_BALL BYE LEG_BYE }
enum DismissalKind { BOWLED CAUGHT LBW RUN_OUT STUMPED HIT_WICKET }

# A signed-in person, keyed by their Firebase Auth UID.
type User @table {
  id: String! @default(expr: "auth.uid")
  name: String!
  # Typed in during onboarding; not verified until phone OTP linking is added.
  phone: String!
  email: String
  photoUrl: String
  city: String!
  role: PlayerRole!
  battingStyle: BattingStyle!
  bowlingStyle: BowlingStyle!
  createdAt: Timestamp! @default(expr: "request.time")
}

type Match @table {
  id: UUID! @default(expr: "uuidV4()")
  # The scorer. Only they can change the match.
  createdBy: User!
  createdAt: Timestamp! @default(expr: "request.time")
  teamAName: String!
  teamBName: String!
  oversPerInnings: Int!
  tossWinner: TeamSide!
  tossDecision: TossDecision!
  status: MatchStatus! @default(value: SETUP)
  # Denormalised for list screens, e.g. "Strikers 145/6 (20.0) · Royals 98/3 (12.4)".
  scoreSummary: String! @default(value: "")
  result: String
}

# A player in one match. Not linked to a User yet; that comes with "add player by phone number".
type MatchPlayer @table {
  id: UUID! @default(expr: "uuidV4()")
  match: Match!
  side: TeamSide!
  # Order the player was listed in, used for display.
  position: Int!
  name: String!
}

# One ball. The scorecard is always derived from the full list of deliveries.
type Delivery @table(key: ["match", "seq"]) {
  match: Match!
  # Position across the whole match, starting at 0.
  seq: Int!
  innings: Int!
  striker: MatchPlayer!
  nonStriker: MatchPlayer!
  bowler: MatchPlayer!
  runsOffBat: Int!
  extra: ExtraType
  # Wide: 1 + runs taken. No-ball: the 1-run penalty. Bye / leg bye: runs taken.
  extraRuns: Int!
  wicketKind: DismissalKind
  playerOut: MatchPlayer
  createdAt: Timestamp! @default(expr: "request.time")
}
