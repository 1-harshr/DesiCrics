# Creates or updates the caller's own profile; the row is always keyed by auth.uid.
mutation UpsertMyProfile(
  $name: String!
  $phone: String!
  $email: String
  $photoUrl: String
  $city: String!
  $role: PlayerRole!
  $battingStyle: BattingStyle!
  $bowlingStyle: BowlingStyle!
) @auth(level: USER) {
  user_upsert(
    data: {
      id_expr: "auth.uid"
      name: $name
      phone: $phone
      email: $email
      photoUrl: $photoUrl
      city: $city
      role: $role
      battingStyle: $battingStyle
      bowlingStyle: $bowlingStyle
    }
  )
}

# Step 1 of creating a match. It starts in SETUP until StartMatch runs.
mutation CreateMatch(
  $teamAName: String!
  $teamBName: String!
  $oversPerInnings: Int!
  $tossWinner: TeamSide!
  $tossDecision: TossDecision!
) @auth(level: USER) {
  match_insert(
    data: {
      createdById_expr: "auth.uid"
      teamAName: $teamAName
      teamBName: $teamBName
      oversPerInnings: $oversPerInnings
      tossWinner: $tossWinner
      tossDecision: $tossDecision
    }
  )
}

# Step 2: one call per player. Only the match's creator can add players, and only while it's in SETUP.
mutation AddMatchPlayer($matchId: UUID!, $side: TeamSide!, $position: Int!, $name: String!)
@auth(level: USER)
@transaction {
  query @redact {
    match(id: $matchId) @check(expr: "this != null", message: "Match not found") {
      createdById @check(expr: "this == auth.uid", message: "Only the scorer can change this match")
      status @check(expr: "this == 'SETUP'", message: "Players can only be added before the match starts")
    }
  }
  matchPlayer_insert(data: { matchId: $matchId, side: $side, position: $position, name: $name })
}

# Step 3: makes the match visible and ready to score.
mutation StartMatch($matchId: UUID!) @auth(level: USER) @transaction {
  query @redact {
    match(id: $matchId) @check(expr: "this != null", message: "Match not found") {
      createdById @check(expr: "this == auth.uid", message: "Only the scorer can change this match")
    }
  }
  match_update(id: $matchId, data: { status: IN_PROGRESS })
}

# Saves one ball and the refreshed summary together. The (match, seq) key rejects a duplicate ball.
mutation RecordDelivery(
  $matchId: UUID!
  $seq: Int!
  $innings: Int!
  $strikerId: UUID!
  $nonStrikerId: UUID!
  $bowlerId: UUID!
  $runsOffBat: Int!
  $extra: ExtraType
  $extraRuns: Int!
  $wicketKind: DismissalKind
  $playerOutId: UUID
  $scoreSummary: String!
  $status: MatchStatus!
  $result: String
) @auth(level: USER) @transaction {
  query @redact {
    match(id: $matchId) @check(expr: "this != null", message: "Match not found") {
      createdById @check(expr: "this == auth.uid", message: "Only the scorer can change this match")
    }
  }
  delivery_insert(
    data: {
      matchId: $matchId
      seq: $seq
      innings: $innings
      strikerId: $strikerId
      nonStrikerId: $nonStrikerId
      bowlerId: $bowlerId
      runsOffBat: $runsOffBat
      extra: $extra
      extraRuns: $extraRuns
      wicketKind: $wicketKind
      playerOutId: $playerOutId
    }
  )
  match_update(id: $matchId, data: { scoreSummary: $scoreSummary, status: $status, result: $result })
}

mutation UndoDelivery(
  $matchId: UUID!
  $seq: Int!
  $scoreSummary: String!
  $status: MatchStatus!
  $result: String
) @auth(level: USER) @transaction {
  query @redact {
    match(id: $matchId) @check(expr: "this != null", message: "Match not found") {
      createdById @check(expr: "this == auth.uid", message: "Only the scorer can change this match")
    }
  }
  delivery_delete(key: { matchId: $matchId, seq: $seq })
  match_update(id: $matchId, data: { scoreSummary: $scoreSummary, status: $status, result: $result })
}
