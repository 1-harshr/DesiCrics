# Local Postgres for the Ktor server. Start with `docker compose up -d`.
# The server's defaults (ServerConfig.kt) point here; Flyway creates the tables on first start.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: desicrics
      POSTGRES_USER: desicrics
      POSTGRES_PASSWORD: desicrics
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U desicrics -d desicrics"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
